name: Nightly TICS scan

on:
  schedule:
    - cron: '10 03 * * *' # Every day at 03:10 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  TICS:
    uses: canonical/hpc-team/.github/workflows/tics-scan.yaml@main
    with:
      project: filesystem-charms
    secrets: inherit
